<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobRaker - Autonomous Job Application Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The world's first fully autonomous job application platform. JobRaker leverages advanced AI to search, apply, and optimize your job hunt 24/7."
    />
    <meta
      property="og:title"
      content="JobRaker - Autonomous Job Application Platform"
    />
    <meta
      property="og:description"
      content="The world's first fully autonomous job application platform. JobRaker leverages advanced AI to search, apply, and optimize your job hunt 24/7."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/jpeg" href="/logo/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo/logo.jpeg" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Questrial&display=swap");

    </style>
    <script>
      (function initializeTheme() {
        try {
          if (
            localStorage.theme === "dark" ||
            (!("theme" in localStorage) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (_) {}
      })();
    </script>
    <!-- Styles are imported via Vite in src/index.tsx (../tailwind.css) -->
  </head>
  <body style="margin: 0; padding: 0; background-color: #000">
    <div id="app"></div>
    <div id="radix-portal"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
