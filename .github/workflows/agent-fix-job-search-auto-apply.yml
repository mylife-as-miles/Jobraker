name: Apply Jobraker job-search and auto-apply fixes

on:
  push:
    branches:
      - agent/fix-job-search-auto-apply

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch search, billing, queue state, and canonical Supabase paths
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          # Starter is entitled to 15 results/search in the backend; make the Jobs UI request all 15.
          replace_exact(
              "src/screens/Dashboard/pages/JobPage.tsx",
              '''          if (subscriptionTier === "Ultimate") {
            maxResultsPerSearch = 100;
          } else if (subscriptionTier === "Pro") {
            maxResultsPerSearch = 50;
          } else if (subscriptionTier === "Basics") {
            maxResultsPerSearch = 20;
          }''',
              '''          if (subscriptionTier === "Ultimate") {
            maxResultsPerSearch = 100;
          } else if (subscriptionTier === "Pro") {
            maxResultsPerSearch = 50;
          } else if (subscriptionTier === "Basics") {
            maxResultsPerSearch = 20;
          } else if (subscriptionTier === "Starter") {
            maxResultsPerSearch = 15;
          }''',
          )

          # Auto Apply commercial price is 10 credits per application. Keep one named constant.
          apply_path = Path("backend/supabase/functions/apply-to-jobs/index.ts")
          apply_text = apply_path.read_text()
          anchor = 'const DEFAULT_RTRVR_TIMEOUT_MS = 300_000;\n'
          if apply_text.count(anchor) != 1:
              raise SystemExit("apply-to-jobs: could not locate credit constant insertion point")
          apply_text = apply_text.replace(anchor, anchor + 'const AUTO_APPLY_CREDIT_COST = 10;\n', 1)
          old_cost_expr = 'automationJobCount * 5'
          occurrences = apply_text.count(old_cost_expr)
          if occurrences < 2:
              raise SystemExit(f"apply-to-jobs: expected multiple 5-credit expressions, found {occurrences}")
          apply_text = apply_text.replace(old_cost_expr, 'automationJobCount * AUTO_APPLY_CREDIT_COST')
          apply_path.write_text(apply_text)

          # Queue refunds and provider launch accounting must use the same 10-credit price.
          replace_exact(
              "backend/supabase/functions/process-auto-apply-queue/index.ts",
              'const AUTO_APPLY_CREDIT_COST = 5;',
              'const AUTO_APPLY_CREDIT_COST = 10;',
          )

          # Launching an RTRVR task is not proof the application was submitted.
          replace_exact(
              "backend/supabase/functions/process-auto-apply-queue/index.ts",
              '''                  status: "Applied",
                  provider_status: "running",
                  canonical_stage: "submitted",''',
              '''                  status: "Pending",
                  provider_status: "running",
                  canonical_stage: "queued",''',
          )

          # Scheduled/manual cron discovery now uses the same reserve -> persist -> settle billing model as live search.
          jobs_cron = Path("backend/supabase/functions/jobs-cron/index.ts")
          cron_text = jobs_cron.read_text()
          replace_import_old = '''import {
  countDisplayableJobsForSearch,
  persistDiscoveredJobs,
} from "../_shared/jobs.ts";'''
          replace_import_new = '''import {
  persistDiscoveredJobs,
  settleJobSearchRunCredits,
} from "../_shared/jobs.ts";'''
          if cron_text.count(replace_import_old) != 1:
              raise SystemExit("jobs-cron: shared jobs import shape changed")
          cron_text = cron_text.replace(replace_import_old, replace_import_new, 1)

          start = cron_text.index("async function runDiscoveryForUser(")
          end = cron_text.index("async function handleManualRun", start)
          new_discovery = r'''async function runDiscoveryForUser(
  serviceClient: any,
  userId: string,
  trigger: "manual_cron" | "scheduled_cron",
  requestedLimit: number,
): Promise<CronRunResult> {
  const { searchQuery, location } = await loadProfileSearchScope(serviceClient, userId);

  if (!searchQuery) {
    return {
      ok: true,
      skipped: true,
      reason: "missing_profile_job_title",
      location,
    };
  }

  const {
    subscriptionTier,
    planCap,
    creditsBalance,
    effectiveLimit,
  } = await resolveJobSearchExecutionLimits(userId, requestedLimit, serviceClient);

  if (effectiveLimit <= 0) {
    return {
      ok: true,
      skipped: true,
      reason: "insufficient_credits",
      searchQuery,
      location,
      requestedLimit,
      planCap,
      creditsBalance,
      subscriptionTier,
    };
  }

  const creditsToReserve = Math.max(1, effectiveLimit);
  const idempotencyKey = `jobs-cron:${trigger}:${userId}:${crypto.randomUUID()}`;
  const { data: reserveRaw, error: reserveError } = await serviceClient.rpc(
    "reserve_credits_for_run",
    {
      p_user_id: userId,
      p_run_type: "job_search",
      p_estimated_credits: creditsToReserve,
      p_idempotency_key: idempotencyKey,
      p_metadata: {
        source: "jobs-cron",
        trigger,
        searchQuery,
        location,
        requestedLimit,
        effectiveLimit,
      },
    },
  );

  const reserve = reserveRaw as Record<string, unknown> | null;
  if (reserveError || !reserve || reserve.success !== true) {
    return {
      ok: true,
      skipped: true,
      reason: "insufficient_credits",
      searchQuery,
      location,
      requestedLimit,
      effectiveLimit,
      planCap,
      creditsBalance,
      subscriptionTier,
      creditDeduction: {
        error: reserveError?.message || reserve?.message || "Could not reserve job-search credits.",
        requiredCredits: creditsToReserve,
        currentBalance: reserve?.current_balance ?? creditsBalance,
      },
    };
  }

  const agentRunId = typeof reserve.agent_run_id === "string" ? reserve.agent_run_id : null;
  if (!agentRunId) {
    throw new Error("Job search credit reservation did not return an agent run id.");
  }

  const searchStartedAt = new Date().toISOString();
  let totalInserted = 0;
  let discoveredJobs: Array<Record<string, unknown>> = [];

  try {
    const result = await discoverJobsFirecrawl(
      {
        serviceClient,
        userId,
        searchQuery,
        location,
        limit: effectiveLimit,
      },
      async (batch) => {
        const { jobsInserted: batchInserted } = await persistDiscoveredJobs(
          serviceClient,
          batch,
          {
            userId,
            searchQuery,
            location,
            trigger,
            requestedLimit,
            effectiveLimit,
            subscriptionTier,
            agentRunId,
          },
        );
        totalInserted += batchInserted;
      },
    );
    discoveredJobs = result.jobs as Array<Record<string, unknown>>;
  } catch (error) {
    await settleJobSearchRunCredits(serviceClient, {
      agentRunId,
      userId,
      searchQuery,
      location,
      searchStartedAt,
      maxCredits: creditsToReserve,
      searchFailed: true,
      failureReason: error instanceof Error ? error.message : String(error),
      jobsInserted: totalInserted,
      jobsDiscovered: discoveredJobs.length,
      settlementIdempotencyKey: `settle:${agentRunId}:failed`,
    });
    throw error;
  }

  const settlement = await settleJobSearchRunCredits(serviceClient, {
    agentRunId,
    userId,
    searchQuery,
    location,
    searchStartedAt,
    maxCredits: creditsToReserve,
    jobsInserted: totalInserted,
    jobsDiscovered: discoveredJobs.length,
    settlementIdempotencyKey: `settle:${agentRunId}:completed`,
  });

  const displayableJobCount = settlement.displayableJobCount;
  const creditDeduction = {
    agentRunId,
    reservedCredits: creditsToReserve,
    creditsCharged: settlement.creditsCharged,
    currentBalance: settlement.currentBalance,
  };

  let providerCreditSync: unknown = null;
  try {
    const syncResult = await syncFirecrawlCreditUsage(serviceClient, {
      source: "jobs-cron",
      userId,
      trigger,
      requestedLimit,
      effectiveLimit,
      jobsInserted: totalInserted,
      jobsFound: discoveredJobs.length,
      jobsDisplayable: displayableJobCount,
    });
    providerCreditSync = {
      remainingCredits: syncResult.usage.remainingCredits,
      planCredits: syncResult.usage.planCredits,
      billingPeriodStart: syncResult.usage.billingPeriodStart,
      billingPeriodEnd: syncResult.usage.billingPeriodEnd,
      alert: syncResult.alert,
    };
  } catch (providerCreditError) {
    console.warn("jobs-cron Firecrawl credit sync failed", providerCreditError);
  }

  return {
    ok: true,
    searchQuery,
    location,
    count: displayableJobCount,
    jobsInserted: totalInserted,
    requestedLimit,
    effectiveLimit,
    planCap,
    creditsBalance,
    subscriptionTier,
    creditDeduction,
    providerCreditSync,
  };
}

'''
          cron_text = cron_text[:start] + new_discovery + cron_text[end:]

          serve_start = cron_text.index("Deno.serve(async (req) => {")
          serve_end = cron_text.index("\ntry {\n  const cronExpr", serve_start)
          new_serve = r'''function createServiceRoleClient() {
  const supabaseUrl = Deno.env.get("SUPABASE_URL");
  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");
  if (!supabaseUrl || !serviceRoleKey) {
    throw new Error("Scheduled job search is missing Supabase service-role configuration.");
  }
  return createClient(supabaseUrl, serviceRoleKey, {
    auth: { persistSession: false },
  });
}

function isServiceRoleRequest(req: Request): boolean {
  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")?.trim();
  const token = req.headers.get("authorization")
    ?.replace(/^Bearer\s+/i, "")
    .trim();
  return Boolean(serviceRoleKey && token && token === serviceRoleKey);
}

Deno.serve(async (req) => {
  const origin = req.headers.get("origin");
  const corsHeaders = getCorsHeaders(origin);

  if (req.method === "OPTIONS") {
    return new Response("ok", { headers: corsHeaders });
  }

  if (req.method !== "POST") {
    return new Response(JSON.stringify({ error: "Method not allowed" }), {
      status: 405,
      headers: { ...corsHeaders, "content-type": "application/json" },
    });
  }

  try {
    if (isServiceRoleRequest(req)) {
      const results = await runScheduledUsers(createServiceRoleClient());
      return new Response(
        JSON.stringify({
          success: true,
          mode: "scheduled",
          users_processed: results.length,
          results,
        }),
        {
          status: 200,
          headers: { ...corsHeaders, "content-type": "application/json" },
        },
      );
    }

    const response = await handleManualRun(req);
    return new Response(await response.text(), {
      status: response.status,
      headers: { ...corsHeaders, "content-type": "application/json" },
    });
  } catch (error: unknown) {
    console.error("jobs-cron.error", error);
    return subscriptionErrorResponse(error, corsHeaders);
  }
});
'''
          cron_text = cron_text[:serve_start] + new_serve + cron_text[serve_end:]
          cron_text = cron_text.replace(
              '''        const serviceRoleClient = createClient(
          Deno.env.get("SUPABASE_URL")!,
          Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!,
          { auth: { persistSession: false } },
        );''',
              '''        const serviceRoleClient = createServiceRoleClient();''',
              1,
          )
          jobs_cron.write_text(cron_text)

          # Canonical Supabase project root is backend/ (config is backend/supabase/config.toml).
          package = Path("package.json")
          package_text = package.read_text()
          replacements = {
              '"supabase:start": "cd backend/supabase && npx supabase start"': '"supabase:start": "cd backend && npx supabase start"',
              '"supabase:stop": "cd backend/supabase && npx supabase stop"': '"supabase:stop": "cd backend && npx supabase stop"',
              '"supabase:status": "cd backend/supabase && npx supabase status"': '"supabase:status": "cd backend && npx supabase status"',
              '"supabase:reset": "cd backend/supabase && npx supabase db reset --local --yes"': '"supabase:reset": "cd backend && npx supabase db reset --local --yes"',
              '"supabase:diff": "bash -lc \'cd backend/supabase && npx supabase db diff -f $(date +%Y%m%d%H%M%S) --local\'"': '"supabase:diff": "bash -lc \'cd backend && npx supabase db diff -f $(date +%Y%m%d%H%M%S) --local\'"',
          }
          for old, new in replacements.items():
              if package_text.count(old) != 1:
                  raise SystemExit(f"package.json canonical Supabase path pattern not found: {old}")
              package_text = package_text.replace(old, new, 1)
          package.write_text(package_text)
          PY

      - name: Add database migration for scheduled dispatch and 10-credit settlement
        shell: bash
        run: |
          cat > backend/supabase/migrations/20260814180000_fix_job_search_auto_apply_reliability.sql <<'SQL'
          -- Align scheduled job discovery with authenticated billing and Auto Apply with the
          -- commercial 10-credit-per-success price.

          CREATE EXTENSION IF NOT EXISTS pg_cron;
          CREATE EXTENSION IF NOT EXISTS pg_net;

          CREATE OR REPLACE FUNCTION public.invoke_jobs_cron_scheduled()
          RETURNS bigint
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = pg_catalog, public
          AS $function$
          DECLARE
            v_project_url text;
            v_service_role_key text;
            v_base_url text;
            v_request_id bigint;
          BEGIN
            SELECT NULLIF(btrim(v.decrypted_secret), '')
            INTO v_project_url
            FROM vault.decrypted_secrets AS v
            WHERE v.name = 'project_url'
            LIMIT 1;

            SELECT NULLIF(btrim(v.decrypted_secret), '')
            INTO v_service_role_key
            FROM vault.decrypted_secrets AS v
            WHERE v.name = 'service_role_key'
            LIMIT 1;

            IF v_project_url IS NULL OR v_service_role_key IS NULL THEN
              RAISE WARNING 'jobs-cron schedule skipped: project_url/service_role_key Vault secrets are missing';
              RETURN NULL;
            END IF;

            v_base_url := regexp_replace(v_project_url, '/+$', '');
            v_base_url := regexp_replace(v_base_url, '/functions/v1$', '', 'i');

            IF v_base_url !~ '^https?://[^[:space:]?#]+$' THEN
              RAISE WARNING 'jobs-cron schedule skipped: invalid project_url Vault secret';
              RETURN NULL;
            END IF;

            SELECT net.http_post(
              url := v_base_url || '/functions/v1/jobs-cron',
              headers := jsonb_build_object(
                'Content-Type', 'application/json',
                'Authorization', 'Bearer ' || v_service_role_key
              ),
              body := jsonb_build_object('scheduled_trigger', true),
              timeout_milliseconds := 30000
            )
            INTO v_request_id;

            RETURN v_request_id;
          EXCEPTION
            WHEN OTHERS THEN
              RAISE WARNING 'jobs-cron scheduled invocation failed (SQLSTATE %): %', SQLSTATE, SQLERRM;
              RETURN NULL;
          END;
          $function$;

          DO $unschedule$
          BEGIN
            PERFORM cron.unschedule('invoke-jobs-cron-hourly');
          EXCEPTION WHEN OTHERS THEN
            NULL;
          END;
          $unschedule$;

          DO $unschedule$
          BEGIN
            PERFORM cron.unschedule('invoke-jobs-cron-scheduled');
          EXCEPTION WHEN OTHERS THEN
            NULL;
          END;
          $unschedule$;

          -- The product default is every six hours. The Edge Function still supports Deno.cron
          -- as a secondary wake-up path when JOBS_CRON_EXPR is configured.
          SELECT cron.schedule(
            'invoke-jobs-cron-scheduled',
            '5 */6 * * *',
            $$ SELECT public.invoke_jobs_cron_scheduled(); $$
          );

          CREATE OR REPLACE FUNCTION public.check_and_settle_agent_run(
            p_agent_run_id uuid
          ) RETURNS json
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = pg_catalog, public
          AS $function$
          DECLARE
            v_total_apps integer;
            v_terminal_apps integer;
            v_successful_apps integer;
            v_actual_credits integer;
            v_status text;
            v_result json;
          BEGIN
            SELECT COUNT(*) INTO v_total_apps
            FROM public.applications
            WHERE agent_run_id = p_agent_run_id;

            IF v_total_apps = 0 THEN
              RETURN json_build_object(
                'success', false,
                'message', 'No applications found for this run'
              );
            END IF;

            SELECT
              COUNT(*),
              COUNT(*) FILTER (
                WHERE canonical_stage NOT IN ('failed', 'terminated', 'draft_ready', 'queued')
              )
            INTO v_terminal_apps, v_successful_apps
            FROM public.applications
            WHERE agent_run_id = p_agent_run_id
              AND canonical_stage IN (
                'submitted', 'failed', 'terminated', 'interview', 'offer', 'rejected', 'withdrawn'
              );

            IF v_terminal_apps = v_total_apps THEN
              -- One successfully completed Auto Apply costs 10 credits.
              v_actual_credits := v_successful_apps * 10;

              IF v_successful_apps = v_total_apps THEN
                v_status := 'completed';
              ELSIF v_successful_apps = 0 THEN
                v_status := 'failed';
              ELSE
                v_status := 'completed';
              END IF;

              v_result := public.settle_run_credits(
                p_agent_run_id := p_agent_run_id,
                p_actual_credits := v_actual_credits,
                p_status := v_status,
                p_failure_reason := CASE
                  WHEN v_successful_apps = 0 THEN 'All applications failed'
                  ELSE NULL
                END,
                p_receipt := jsonb_build_object(
                  'total_applications', v_total_apps,
                  'successful_applications', v_successful_apps,
                  'failed_applications', v_total_apps - v_successful_apps,
                  'credits_per_successful_application', 10
                )
              );

              RETURN v_result;
            END IF;

            RETURN json_build_object(
              'success', false,
              'message', 'Not all applications are terminal',
              'total_applications', v_total_apps,
              'terminal_applications', v_terminal_apps
            );
          END;
          $function$;

          REVOKE ALL ON FUNCTION public.invoke_jobs_cron_scheduled() FROM PUBLIC, anon, authenticated;
          GRANT EXECUTE ON FUNCTION public.invoke_jobs_cron_scheduled() TO service_role;

          REVOKE ALL ON FUNCTION public.check_and_settle_agent_run(uuid) FROM PUBLIC, anon, authenticated;
          GRANT EXECUTE ON FUNCTION public.check_and_settle_agent_run(uuid) TO service_role;
          SQL

      - name: Mark the nested Supabase tree as legacy-only
        shell: bash
        run: |
          cat > backend/supabase/supabase/README.md <<'EOF'
          # Legacy Supabase Snapshot — Do Not Deploy

          This nested `backend/supabase/supabase/` tree is retained only as historical source material.

          **Canonical Jobraker Supabase project:** `backend/supabase/`

          - Canonical Edge Functions: `backend/supabase/functions/`
          - Canonical migrations: `backend/supabase/migrations/`
          - Canonical CLI config: `backend/supabase/config.toml`
          - Run Supabase CLI commands from `backend/`, not `backend/supabase/`.

          Do not implement fixes in this nested snapshot. Any production change belongs in the canonical paths above.
          EOF

          cat > backend/supabase/supabase/AGENTS.md <<'EOF'
          # Agent instructions

          Do not edit or deploy files under this directory. This is a legacy snapshot.
          The canonical Supabase implementation is one directory up: `backend/supabase/functions/`, `backend/supabase/migrations/`, and `backend/supabase/config.toml`.
          EOF

      - name: Validate repair invariants
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path("backend/supabase/functions/apply-to-jobs/index.ts").read_text()
          queue = Path("backend/supabase/functions/process-auto-apply-queue/index.ts").read_text()
          cron = Path("backend/supabase/functions/jobs-cron/index.ts").read_text()
          jobs = Path("src/screens/Dashboard/pages/JobPage.tsx").read_text()
          migration = Path("backend/supabase/migrations/20260814180000_fix_job_search_auto_apply_reliability.sql").read_text()
          package = Path("package.json").read_text()

          checks = {
              "apply reservation uses 10-credit constant": "const AUTO_APPLY_CREDIT_COST = 10;" in app and "automationJobCount * 5" not in app,
              "queue refund cost is 10": "const AUTO_APPLY_CREDIT_COST = 10;" in queue,
              "RTRVR remains pending while running": 'status: "Pending"' in queue and 'provider_status: "running"' in queue and 'canonical_stage: "queued"' in queue,
              "Starter requests 15 results": 'subscriptionTier === "Starter"' in jobs and "maxResultsPerSearch = 15;" in jobs,
              "scheduled cron accepts only service-role path": "isServiceRoleRequest" in cron and "runScheduledUsers(createServiceRoleClient())" in cron,
              "scheduled search reserves and settles": 'p_run_type: "job_search"' in cron and "settleJobSearchRunCredits" in cron,
              "database settlement charges 10": "v_successful_apps * 10" in migration,
              "cron uses service role": "service_role_key" in migration and "invoke-jobs-cron-scheduled" in migration,
              "Supabase scripts use canonical backend root": "cd backend/supabase && npx supabase" not in package,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
          if failed:
              raise SystemExit("Invariant failures: " + ", ".join(failed))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Parse modified TypeScript edge functions
        shell: bash
        run: |
          npx esbuild backend/supabase/functions/jobs-cron/index.ts --bundle --platform=neutral --external:* --outfile=/tmp/jobs-cron.js
          npx esbuild backend/supabase/functions/apply-to-jobs/index.ts --bundle --platform=neutral --external:* --outfile=/tmp/apply-to-jobs.js
          npx esbuild backend/supabase/functions/process-auto-apply-queue/index.ts --bundle --platform=neutral --external:* --outfile=/tmp/process-auto-apply-queue.js

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run targeted repository checks
        shell: bash
        run: |
          npm run lint:rtrvr-integration
          npm run verify:auto-apply-queue

      - name: Commit repaired implementation
        shell: bash
        run: |
          rm .github/workflows/agent-fix-job-search-auto-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix job search and auto apply reliability"
          git push origin HEAD:agent/fix-job-search-auto-apply
